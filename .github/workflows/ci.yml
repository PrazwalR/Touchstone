name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned tools
        run: |
          npm install --global pnpm@10.14.0
          python -m pip install uv==0.11.15
          uv tool install slither-analyzer==0.11.6
          uv tool install pip-audit==2.10.1
          mkdir -p "$RUNNER_TEMP/foundry"
          curl --fail --location --retry 3 https://github.com/foundry-rs/foundry/releases/download/v1.5.1/foundry_v1.5.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/foundry.tar.gz"
          echo "73640b01bd9ed29fdb4965085099371f8cf0dbbec3e2086cf54564efc4dcfe88  $RUNNER_TEMP/foundry.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Solidity formatting, build and runtime sizes
        run: |
          cd contracts
          forge fmt --check
          forge build
          cd ..
          python scripts/check_release_gates.py sizes
          python -m unittest discover -s scripts -p test_release_gates.py
      - name: Solidity tests including invariants
        working-directory: contracts
        run: forge test -vvv
      - name: Backend types, ABI consistency and Anvil integration
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm abi
          git diff --exit-code -- shared/abi
          pnpm typecheck
          pnpm -r test
          pnpm audit
      - name: Dashboard types, tests, build and contract sync
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm sync
          git diff --exit-code -- abi deployments
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm audit
      - name: Rust bytecode replay
        working-directory: sim
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          REPLAY_PORT=18568 ./check-anvil.sh
      - name: Research types, tests and dependency audit
        working-directory: research
        run: |
          uv sync --locked
          uv run ruff check .
          uv run mypy
          uv run pytest
          pip-audit -r requirements.lock
      - name: Gas regression gate against pre-repair measurements
        if: ${{ !cancelled() }}
        run: python scripts/check_release_gates.py gas
      - name: Coverage evidence and gate
        if: ${{ !cancelled() }}
        working-directory: contracts
        env:
          FORGE_SNAPSHOT_EMIT: 'false'
        run: |
          forge coverage --report lcov --ir-minimum
          python ../scripts/check_release_gates.py coverage
      - name: Static analysis
        if: ${{ !cancelled() }}
        working-directory: contracts
        run: |
          slither . --config-file slither.config.json --json "$RUNNER_TEMP/slither.json" || slither_status=$?
          python ../scripts/check_release_gates.py slither "$RUNNER_TEMP/slither.json"
